<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="#0f0a1a"/>
  <g transform="translate(60,60)">
    <circle r="40" fill="none" stroke="url(#g)" stroke-width="3.5" stroke-dasharray="6 3"/>
    <circle r="28" fill="none" stroke="url(#g)" stroke-width="2" opacity=".4">
      <animate attributeName="r" values="28;34;28" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".3;.6;.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="0" y1="-18" x2="0" y2="4">
        <animate attributeName="y1" values="-18;-22;-18" dur="2s" repeatCount="indefinite"/></line>
      <circle cx="0" cy="8" r="5" fill="#818cf8" opacity=".8">
        <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="rotate(72) translate(0,-40)">
      <circle cx="0" cy="0" r="4" fill="#c084fc" opacity=".7">
        <animate attributeName="opacity" values=".4;1;.4" dur="2.2s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="rotate(144) translate(0,-40)">
      <circle cx="0" cy="0" r="3.5" fill="#818cf8" opacity=".6">
        <animate attributeName="opacity" values=".5;1;.5" dur="1.8s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>
