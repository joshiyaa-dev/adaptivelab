<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f0a1a"/><stop offset="1" stop-color="#1a1230"/>
    </linearGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <g transform="translate(300,150)">
    <circle r="100" fill="none" stroke="url(#lg)" stroke-width="2" stroke-dasharray="8 4">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/></circle>
    <circle r="70" fill="none" stroke="url(#lg)" stroke-width="1.5" opacity=".4">
      <animate attributeName="r" values="70;80;70" dur="3s" repeatCount="indefinite"/></circle>
    <circle r="40" fill="none" stroke="#818cf8" stroke-width="2" opacity=".3"/>
    <g stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="0" y1="-50" x2="0" y2="-10"><animate attributeName="y1" values="-50;-55;-50" dur="2s" repeatCount="indefinite"/></line>
      <circle cx="0" cy="0" r="10" fill="#818cf8" opacity=".7"><animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/></circle>
    </g>
    <!-- floating nodes -->
    <circle cx="-120" cy="-40" r="5" fill="#c084fc" opacity=".6"><animate attributeName="opacity" values=".3;1;.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="50" r="4" fill="#818cf8" opacity=".5"><animate attributeName="opacity" values=".5;1;.5" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="-80" r="3" fill="#c084fc" opacity=".4"><animate attributeName="opacity" values=".4;1;.4" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
  <text x="300" y="280" font-family="Segoe UI,sans-serif" font-size="13" fill="#9aa5d1" text-anchor="middle" opacity=".7">
    <animate attributeName="opacity" values=".5;.8;.5" dur="3s" repeatCount="indefinite"/>
    AdaptiLab — every answer teaches
  </text>
</svg>
